[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "esim-toolmanager"
version = "1.2.3"
description = "Automated Tool Manager for eSim external tools and dependencies"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "eSim Tool Manager Contributors" }]
keywords = ["esim", "eda", "ngspice", "kicad", "tool-manager"]
dependencies = [
  "PyYAML>=6.0",
  "packaging>=23.0",
  "py7zr>=0.20.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
esim-tm = "esim_toolmanager.cli:main"

[tool.setuptools.packages.find]
include = ["esim_toolmanager*"]

[tool.setuptools.package-data]
esim_toolmanager = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
